services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chatsito
      POSTGRES_PASSWORD: chatsito
      POSTGRES_DB: chatsito
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    environment:
      # LIVEKIT_CONFIG se mergea con los defaults de --dev (keys devkey/secret)
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:3000/livekit/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
